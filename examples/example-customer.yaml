# ClusterMind Edge — Example Customer Values
# Copy this file and fill in your own values.
# NEVER commit real API keys or customer-specific hostnames to this repo.
#
# First create the namespace and a Secret with the agent token from the dashboard:
#   kubectl create namespace clustermind
#   kubectl -n clustermind create secret generic clustermind-agent-token \
#     --from-literal=CLUSTER_API_KEY=<agent token>
#
# Install:
#   helm install clustermind-edge oci://ghcr.io/smirnov-labs/charts/clustermind-edge \
#     --version 0.3.0 -f my-values.yaml --namespace clustermind

controlPlane:
  existingSecret: clustermind-agent-token  # pragma: allowlist secret

redis:
  persistence:
    # Empty uses the cluster's default StorageClass. New EKS clusters have none, so
    # name one there, such as gp3.
    storageClass: ""

# Off by default. Turn it on to let the agent run changes approved in the dashboard.
superAgent:
  enabled: false

metrics:
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false
