apiVersion: v2
name: clustermind-edge
description: ClusterMind Edge - Kubernetes diagnostic agent with AI-powered cluster analysis
type: application
version: 0.3.0
# The edge image tag the chart deploys unless image.tag is set. Keep it a released
# vX.Y.Z tag of ghcr.io/smirnov-labs/clustermind-edge. The publish workflow sets only
# `version` from the git tag, never this.
appVersion: "v1.9.4"
# Redis runs as a native sidecar (an init container with restartPolicy: Always).
kubeVersion: ">=1.29.0-0"
home: https://clustermind.ai
keywords:
  - kubernetes
  - diagnostics
  - ai
  - monitoring
maintainers:
  - name: Smirnov Labs
