{{- if .Values.superAgent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clustermind-edge.fullname" . }}-super-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clustermind-edge.superAgentLabels" . | nindent 4 }}
  annotations:
    {{- include "clustermind-edge.annotations" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "clustermind-edge.superAgentSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clustermind-edge.superAgentLabels" . | nindent 8 }}
      annotations:
        {{- include "clustermind-edge.annotations" . | nindent 8 }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        # Restart the pod when its config or the chart's Secrets change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/executor-secret: {{ include (print $.Template.BasePath "/super-agent-secret.yaml") . | sha256sum }}
        checksum/redis-secret: {{ include (print $.Template.BasePath "/redis-secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "clustermind-edge.superAgentServiceAccountName" . }}
      # SIGTERM starts the super-agent's graceful shutdown. That takes about 1s when
      # idle and up to about 25s when an approved change is in flight.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.superAgent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: super-agent
          image: {{ include "clustermind-edge.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "clustermind-edge.fullname" . }}-config
          env:
            - name: MODE
              value: "privileged"
            # DIAGNOSTIC_MODE=readwrite is critical for the super-agent: without
            # it, Settings.diagnostic_mode defaults to readonly (config.py:119),
            # which causes get_system_prompt() to render the read-only escalation
            # block — telling the privileged agent to "expect RBAC error" even
            # though it has full RBAC. The agent then ends its turn with text
            # only and zero tool calls, producing the silent-success bug.
            # Refs: claude-k8s spec 2026-04-19 RC1, Phase 0.1.
            - name: DIAGNOSTIC_MODE
              value: {{ .Values.superAgent.diagnosticMode | default "readwrite" | quote }}
            # The edge pod's Redis, through its Service. The super-agent keeps its coordination
            # state there (Slack thread ownership, the verification handoff). It claims
            # approvals and gets its credentials from the control plane with the executor token.
            - name: REDIS_URL
              value: "redis://{{ include "clustermind-edge.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:6379/0"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "clustermind-edge.redisSecretName" . }}
                  key: {{ include "clustermind-edge.redisSecretKey" . }}
            - name: EXECUTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "clustermind-edge.executorSecretName" . }}
                  key: {{ include "clustermind-edge.executorSecretKey" . }}
            {{- if or .Values.anthropic.apiKey .Values.anthropic.existingSecret }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "clustermind-edge.anthropicSecretName" . }}
                  key: {{ .Values.anthropic.existingSecretKey | default "ANTHROPIC_API_KEY" }}
            {{- end }}
            {{- if or .Values.slack.botToken .Values.slack.existingSecret }}
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "clustermind-edge.slackSecretName" . }}
                  key: SLACK_BOT_TOKEN
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "clustermind-edge.slackSecretName" . }}
                  key: SLACK_SIGNING_SECRET
            - name: SLACK_TEAM_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "clustermind-edge.slackSecretName" . }}
                  key: SLACK_TEAM_ID
            - name: SLACK_ALERT_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: {{ include "clustermind-edge.slackSecretName" . }}
                  key: SLACK_ALERT_CHANNEL
            {{- else }}
            # Required at startup even when Slack goes through the control plane. The
            # super-agent serves no Slack endpoint, so empty values are safe here.
            - name: SLACK_BOT_TOKEN
              value: ""
            - name: SLACK_SIGNING_SECRET
              value: ""
            - name: SLACK_TEAM_ID
              value: ""
            {{- end }}
          {{- with .Values.superAgent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The HTTP server listens only once startup is done, and startup waits up to
          # ~75s for the edge pod's Redis. The startup probe holds liveness off for up
          # to 150s.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: repo-storage
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: repo-storage
          emptyDir:
            sizeLimit: 2Gi
{{- end }}
