{{- if and .Values.superAgent.enabled (dig "executorToken" "" .Values.superAgent) (not (dig "existingSecret" "" .Values.superAgent)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clustermind-edge.fullname" . }}-super-agent-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clustermind-edge.superAgentLabels" . | nindent 4 }}
type: Opaque
stringData:
  EXECUTOR_TOKEN: {{ dig "executorToken" "" .Values.superAgent | quote }}
{{- end }}
