{{- if .Values.rbac.create }}
# Read access for the regular agent. It deliberately excludes Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "clustermind-edge.fullname" . }}-readonly
  labels:
    {{- include "clustermind-edge.labels" . | nindent 4 }}
rules:
  # Core resources
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - services/status
      - endpoints
      - nodes
      - nodes/status
      - events
      - configmaps
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - persistentvolumes
      - persistentvolumes/status
      - namespaces
      - resourcequotas
      - limitranges
      - replicationcontrollers
      - replicationcontrollers/status
    verbs: ["get", "list", "watch"]
  # Apps resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/status
      - replicasets
      - replicasets/status
      - statefulsets
      - statefulsets/status
      - daemonsets
      - daemonsets/status
    verbs: ["get", "list", "watch"]
  # Batch resources
  - apiGroups: ["batch"]
    resources:
      - jobs
      - jobs/status
      - cronjobs
      - cronjobs/status
    verbs: ["get", "list", "watch"]
  # Autoscaling
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
      - horizontalpodautoscalers/status
    verbs: ["get", "list", "watch"]
  # Networking
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - ingresses/status
      - networkpolicies
    verbs: ["get", "list", "watch"]
  # Storage
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - volumeattachments
    verbs: ["get", "list", "watch"]
  # Cert-manager (if installed)
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
      - certificates/status
      - certificaterequests
      - issuers
      - clusterissuers
    verbs: ["get", "list", "watch"]
  # Metrics, for kubectl top
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]
  # Argo CD (if installed), for application sync status
  - apiGroups: ["argoproj.io"]
    resources:
      - applications
      - applications/status
      - applicationsets
      - applicationsets/status
    verbs: ["get", "list", "watch"]
  # Longhorn (if installed)
  - apiGroups: ["longhorn.io"]
    resources:
      - volumes
      - nodes
      - instancemanagers
      - engines
      - replicas
      - settings
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "clustermind-edge.fullname" . }}-readonly
  labels:
    {{- include "clustermind-edge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "clustermind-edge.fullname" . }}-readonly
subjects:
  - kind: ServiceAccount
    name: {{ include "clustermind-edge.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
