{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled }}
# Metric names must match METRIC_PREFIX ("clustermindai_") in the edge agent. An
# expression over a series that doesn't exist never fires and still shows as healthy.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "clustermind-edge.fullname" . }}
  namespace: {{ .Values.metrics.prometheusRule.namespace | default "monitoring" }}
  labels:
    {{- include "clustermind-edge.labels" . | nindent 4 }}
spec:
  groups:
    - name: clustermind-edge
      rules:
        - alert: ClaudeDiagnosticRunsFailing
          expr: |
            increase(clustermindai_diagnostic_runs_total{status="failure"}[1h]) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ClusterMind diagnostic runs are failing"
            description: "More than 2 diagnostic runs have failed in the last hour."

        - alert: ClaudeAgentErrors
          expr: |
            increase(clustermindai_agent_errors_total[30m]) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ClusterMind agent errors increasing"
            description: "The agent has hit {{`{{ $value }}`}} errors in the last 30 minutes."

        - alert: ClaudeHighAPICost
          expr: |
            increase(clustermindai_agent_cost_usd_total[24h]) > 10
          for: 5m
          labels:
            severity: info
          annotations:
            summary: "ClusterMind API costs are high"
            description: "Anthropic API costs have exceeded $10 in the last 24 hours."

        - alert: ClaudeRedisDown
          expr: |
            increase(clustermindai_redis_operations_total{status="error"}[5m]) > 10
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "ClusterMind Redis connection issues"
            description: "Redis operations are failing, so state may not be saved."

        - alert: ClaudeSlackWebhookLatency
          expr: |
            histogram_quantile(0.95, rate(clustermindai_slack_webhook_latency_seconds_bucket[5m])) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ClusterMind Slack webhook latency is high"
            description: "95th percentile webhook latency is {{`{{ $value }}`}}s."

    # The agent's link to the control plane. The probes deliberately ignore it, so a
    # lost link (for example a rotated agent token) shows up only here.
    # clustermindai_control_plane_configured gates the rules: in direct Slack mode and
    # on the super-agent the WebSocket and heartbeat gauges stay 0 by design.
    - name: clustermind-edge-control-plane
      rules:
        - alert: ClusterMindEdgeControlPlaneStale
          expr: |
            (
              (time() - clustermindai_control_plane_heartbeat_last_success_timestamp_seconds > 300)
              or
              (clustermindai_control_plane_ws_connected == 0)
            )
            and
            (clustermindai_control_plane_configured == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ClusterMind edge {{`{{ $labels.namespace }}/{{ $labels.pod }}`}} lost the control plane"
            description: "No heartbeat accepted for 5+ minutes, or the WebSocket is down, so investigations and config no longer reach this cluster. clustermindai_control_plane_*_failures_total says why (unauthorized, http_5xx, http_other, network)."

        - alert: ClusterMindEdgeControlPlaneStaleCritical
          expr: |
            (
              (time() - clustermindai_control_plane_heartbeat_last_success_timestamp_seconds > 300)
              or
              (clustermindai_control_plane_ws_connected == 0)
            )
            and
            (clustermindai_control_plane_configured == 1)
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "ClusterMind edge {{`{{ $labels.namespace }}/{{ $labels.pod }}`}} has been cut off from the control plane for 30+ minutes"
            description: "See ClusterMindEdgeControlPlaneStale. Restarting the agent does not fix a control-plane outage; check the failure reasons first."

        - alert: ClusterMindEdgeControlPlaneAuthRejected
          # 401/403 means the agent token is wrong, for example after it was
          # regenerated in the dashboard. It never heals on its own.
          expr: |
            (increase(clustermindai_control_plane_ws_connect_failures_total{reason="unauthorized"}[10m]) > 0)
            or
            (increase(clustermindai_control_plane_heartbeat_failures_total{reason="unauthorized"}[10m]) > 0)
          labels:
            severity: critical
          annotations:
            summary: "The control plane rejects the agent token of ClusterMind edge {{`{{ $labels.namespace }}/{{ $labels.pod }}`}}"
            description: "The control plane answered 401/403 in the last 10 minutes: the token in secret {{ include "clustermind-edge.controlPlaneSecretName" . }} is not the cluster's current agent token. Put the current token in the secret and restart the agent, or regenerate it in the dashboard first."
{{- end }}
