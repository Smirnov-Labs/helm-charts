{{- if and .Values.rbac.create .Values.superAgent.enabled }}
# Write access for the super-agent, which runs only changes a person approved in the
# dashboard. It cannot delete RBAC objects or CRDs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "clustermind-edge.fullname" . }}-readwrite
  labels:
    {{- include "clustermind-edge.superAgentLabels" . | nindent 4 }}
rules:
  # Nodes: cordon, drain, label, taint
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/status
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
  # Pod eviction, for kubectl drain
  - apiGroups: [""]
    resources:
      - pods/eviction
    verbs: ["create"]
  - apiGroups: [""]
    resources:
      - namespaces
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Core resources
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - pods/exec
      - services
      - services/status
      - endpoints
      - configmaps
      - secrets
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - persistentvolumes
      - persistentvolumes/status
      - events
      - resourcequotas
      - limitranges
      - replicationcontrollers
      - replicationcontrollers/status
      - serviceaccounts
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Apps resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/status
      - deployments/scale
      - replicasets
      - replicasets/status
      - replicasets/scale
      - statefulsets
      - statefulsets/status
      - statefulsets/scale
      - daemonsets
      - daemonsets/status
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Batch resources
  - apiGroups: ["batch"]
    resources:
      - jobs
      - jobs/status
      - cronjobs
      - cronjobs/status
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Autoscaling
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
      - horizontalpodautoscalers/status
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Networking
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - ingresses/status
      - networkpolicies
      - ingressclasses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Storage
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - volumeattachments
      - volumeattachments/status
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # RBAC: no delete
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Policy
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Cert-manager (if installed)
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
      - certificates/status
      - certificaterequests
      - certificaterequests/status
      - issuers
      - clusterissuers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Traefik (if installed)
  - apiGroups: ["traefik.io", "traefik.containo.us"]
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
      - tlsoptions
      - tlsstores
      - traefikservices
      - serverstransports
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Istio (if installed)
  - apiGroups: ["networking.istio.io"]
    resources:
      - virtualservices
      - destinationrules
      - gateways
      - serviceentries
      - sidecars
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Prometheus Operator (if installed)
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - servicemonitors
      - podmonitors
      - prometheusrules
      - prometheuses
      - alertmanagers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Argo CD (if installed), for GitOps changes
  - apiGroups: ["argoproj.io"]
    resources:
      - applications
      - applicationsets
      - appprojects
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Metrics
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]
  # CRDs: no delete
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "clustermind-edge.fullname" . }}-readwrite
  labels:
    {{- include "clustermind-edge.superAgentLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "clustermind-edge.fullname" . }}-readwrite
subjects:
  - kind: ServiceAccount
    name: {{ include "clustermind-edge.superAgentServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
