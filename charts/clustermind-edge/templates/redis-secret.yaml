{{- if and (include "clustermind-edge.redisAuth" .) (dig "auth" "password" "" .Values.redis) (not (dig "auth" "existingSecret" "" .Values.redis)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clustermind-edge.fullname" . }}-redis-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clustermind-edge.labels" . | nindent 4 }}
type: Opaque
stringData:
  REDIS_PASSWORD: {{ dig "auth" "password" "" .Values.redis | quote }}
{{- end }}
