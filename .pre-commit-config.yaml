repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  # The chart checks CI runs. They need Helm and python3 with PyYAML.
  - repo: local
    hooks:
      - id: clustermind-edge-chart
        name: clustermind-edge chart checks
        entry: tests/clustermind-edge.sh
        language: system
        files: ^(charts/clustermind-edge/|tests/clustermind-edge\.sh$)
        pass_filenames: false
