name: Helm Chart Publish

on:
  push:
    tags:
      - 'v*'
  # Lint and render only; nothing is published from a pull request.
  pull_request:
  workflow_dispatch:
    inputs:
      chart:
        description: 'Chart to publish (e.g., clustermind-edge)'
        required: true
        default: 'clustermind-edge'

env:
  REGISTRY: ghcr.io/smirnov-labs/charts

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Determine chart to publish
        id: chart
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.chart }}" >> $GITHUB_OUTPUT
          else
            echo "name=clustermind-edge" >> $GITHUB_OUTPUT
          fi

      - name: Lint chart
        run: |
          CHART="charts/${{ steps.chart.outputs.name }}"
          echo "Linting $CHART..."
          helm lint --strict "$CHART" --namespace clustermind -f "$CHART/ci/test-values.yaml"

      # helm lint doesn't evaluate the chart's fail checks, so render it too: with the
      # CI values, with every optional part on, and once each where it must refuse.
      - name: Install render assertion dependency
        run: python3 -m pip install PyYAML==6.0.3

      - name: Render chart
        run: |
          CHART="charts/${{ steps.chart.outputs.name }}"
          helm template clustermind-edge "$CHART" --namespace clustermind -f "$CHART/ci/test-values.yaml" > /dev/null
          helm template clustermind-edge "$CHART" --namespace clustermind -f "$CHART/ci/test-values.yaml" \
            --set superAgent.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            --set metrics.prometheusRule.enabled=true \
            --set redis.persistence.enabled=false \
            --set diagnostics.localFallback.enabled=true > /dev/null
          helm template clustermind-edge "$CHART" --namespace clustermind -f "$CHART/ci/test-values.yaml" \
            -f "$CHART/ci/arm64-values.yaml" > /tmp/arm64-chart.yaml
          python3 - <<'PYTHON'
          import yaml
          workloads = [doc for doc in yaml.safe_load_all(open('/tmp/arm64-chart.yaml'))
                       if doc and doc.get('kind') in ('StatefulSet', 'Deployment')]
          assert len(workloads) == 2, workloads
          for workload in workloads:
              selector = workload['spec']['template']['spec']['nodeSelector']
              assert selector['kubernetes.io/arch'] == 'arm64', workload['metadata']['name']
              assert selector['kubernetes.io/os'] == 'linux', workload['metadata']['name']
          PYTHON
          if helm template clustermind-edge "$CHART" -f "$CHART/ci/test-values.yaml" > /dev/null 2>&1; then
            echo "::error::the chart rendered into the default namespace; it must refuse"
            exit 1
          fi
          if helm template clustermind-edge "$CHART" --namespace clustermind > /dev/null 2>&1; then
            echo "::error::the chart rendered without an agent token; it must refuse"
            exit 1
          fi

      - name: Package chart
        if: github.event_name != 'pull_request'
        id: package
        run: |
          CHART="charts/${{ steps.chart.outputs.name }}"

          # A tag sets the chart version only. appVersion stays as Chart.yaml has it: it
          # is the edge image tag the chart deploys, which the chart version is not.
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Setting chart version to $VERSION"
            sed -i "s/^version:.*/version: $VERSION/" "$CHART/Chart.yaml"
          fi

          helm package "$CHART"
          PKG=$(ls *.tgz)
          echo "package=$PKG" >> $GITHUB_OUTPUT
          echo "Packaged: $PKG"

      - name: Push chart to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "Publishing ${{ steps.package.outputs.package }} to oci://$REGISTRY..."
          helm push "${{ steps.package.outputs.package }}" "oci://$REGISTRY"
          echo "Published to oci://$REGISTRY/${{ steps.chart.outputs.name }}"
