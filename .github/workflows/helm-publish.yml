name: Helm Chart Publish

on:
  push:
    tags:
      - 'v*'
  # Tests only; nothing is published from a pull request.
  pull_request:
  # Tests the chosen ref, and publishes only when that ref is a v* tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/smirnov-labs/charts
  CHART: charts/clustermind-edge

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The oldest Helm the README supports, and the current release.
      - name: Set up Helm 3.8
        id: helm3
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.8.2

      - name: Set up Helm 4
        id: helm4
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Install render assertion dependency
        run: python3 -m pip install PyYAML==6.0.3

      - name: Check chart with Helm 3.8
        env:
          HELM: ${{ steps.helm3.outputs.helm-path }}
        run: tests/clustermind-edge.sh

      - name: Check chart with Helm 4
        env:
          HELM: ${{ steps.helm4.outputs.helm-path }}
        run: tests/clustermind-edge.sh

      - name: Verify default images support AMD64 and ARM64
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          import yaml
          from pathlib import Path
          chart = Path(os.environ['CHART'])
          metadata = yaml.safe_load((chart / 'Chart.yaml').read_text())
          values = yaml.safe_load((chart / 'values.yaml').read_text())
          edge = (values['global']['imageRegistry'] + '/' + values['image']['repository']
                  + ':' + (values['image']['tag'] or metadata['appVersion']))
          for image in (edge, values['redis']['image']):
              index = json.loads(subprocess.check_output(
                  ['docker', 'buildx', 'imagetools', 'inspect', image, '--raw'], text=True))
              platforms = {(m.get('platform', {}).get('os'), m.get('platform', {}).get('architecture'))
                           for m in index.get('manifests', [])}
              assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms, (image, platforms)
              print(image + ' supports linux/amd64 and linux/arm64')
          PYTHON

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      # The tag names the version Chart.yaml already holds; nothing rewrites Chart.yaml.
      # appVersion is the edge image tag the chart deploys, which the chart version is not.
      - name: Check the tag matches Chart.yaml
        id: version
        run: |
          VERSION=$(helm show chart "$CHART" | sed -n 's/^version: //p')
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $VERSION in $CHART/Chart.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # GHCR lets a push replace a version, and installs that pinned it would then get
      # other content. To publish a version again, delete it in GHCR first.
      - name: Refuse to replace a published version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if helm show chart "oci://$REGISTRY/clustermind-edge" --version "$VERSION" > /dev/null 2>&1; then
            echo "::error::clustermind-edge $VERSION is already published to oci://$REGISTRY; bump version in Chart.yaml and tag that"
            exit 1
          fi

      - name: Package and push chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm package "$CHART"
          helm push "clustermind-edge-$VERSION.tgz" "oci://$REGISTRY"
          echo "Published oci://$REGISTRY/clustermind-edge:$VERSION"
